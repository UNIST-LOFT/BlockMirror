<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Blockly + Python 실행 예제</title>
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <!-- <script src="./node_modules/blockly/blockly_compressed"></script>
  <script src="./node_modules/blockly/blocks_compressed.js"></script>
  <script src="./node_modules/blockly/python_compressed.js"></script> -->
  <script src="./node_modules/skulpt/dist/skulpt.min.js" type="text/javascript"></script> 
  <script src="./node_modules/skulpt/dist/skulpt-stdlib.js" type="text/javascript"></script> 
  <style>
    html, body { height: 100%; margin: 0; font-family: sans-serif; }
    #blocklyDiv { height: 60%; width: 100%; }
    #codeArea, #outputArea {
      padding: 10px;
      font-family: monospace;
      background: #f0f0f0;
      white-space: pre-wrap;
    }
    #buttons { padding: 10px; background: #eee; }
  </style>
</head>
<body>

    <div id="blocklyDiv"></div>
  
    <div id="buttons">
      <button onclick="runCode()">▶ 실행</button>
    </div>
  
    <div><strong>🔤 Python 코드:</strong></div>
    <pre id="codeArea">// 블록을 조립하면 여기에 Python 코드가 생성됩니다.</pre>
  
    <div><strong>📤 실행 결과:</strong></div>
    <pre id="outputArea">// 여기에 결과가 출력됩니다.</pre>
  
    <xml id="toolbox" style="display: none">
      <block type="math_number"></block>
      <!-- <block type="multiply_numbers"></block>
      <block type="print_input"></block>
      <block type="has_close_elements"></block>
      <block type="intersperse"></block> -->
      <block type="is_prime"></block>
      <!-- <block type="my_custom_block"></block> -->
    </xml>
  
    <!-- 💡 JavaScript 파일 로드 -->
    <script src="main.js" type="module"></script>
  </body>
</html>
